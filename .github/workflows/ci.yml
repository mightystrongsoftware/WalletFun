name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    name: Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build

      - name: Audit
        run: npm audit --audit-level=high

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Audit
        run: npm audit --audit-level=high

  ios:
    name: iOS
    runs-on: macos-latest
    defaults:
      run:
        working-directory: iOS
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Tuist
        uses: jdx/mise-action@v2

      - name: Generate project
        run: tuist generate

      - name: Build unsigned app
        run: >
          xcodebuild
          -project WalletFun.xcodeproj
          -scheme WalletFun
          -destination generic/platform=iOS
          -derivedDataPath build/DerivedData
          CODE_SIGNING_ALLOWED=NO
          build

